<!DOCTYPE html>

<html>
	<head>
		<style>
			html, body 
			{
            margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				text-align: center;
				background-color: #ffe6eb; 
				font-family: Arial, sans-serif;
        	}
			
			h1
			{
				margin: 0;
				 font-size: min(6vw, 2.5rem);
			}

			img, video
			{
				max-width: 85vw;    
				max-height: 35vh;   
				width: auto;
				height: auto;
				object-fit: contain;
			}

			h5
			{
				margin: 0;
				 font-size: min(4vw, 1.2rem);
			}
		</style>
	</head>
	<body>
		<h1>Hi baby! I love you :></h1>
		<img src="IMG_2055.jpeg"> 
		<h5>kiss mo pwet ko hehe</h5>
		<video controls playsinline preload="metadata">
			<source src="IMG_2057.mov" type=video/quicktime>
			<source src="IMG_2057.mov" type=video/mp4>
		</video>
	</body>
	
</html>
